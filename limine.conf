# Timeout in seconds that Limine will use before automatically booting.
timeout: 3

# The entry name that will be displayed in the boot menu.
/KRISHNA OS
    # We use the Limine boot protocol.
    protocol: limine

    # Path to the kernel to boot. boot():/ represents the partition on which limine.conf is located.
    path: boot():/boot/kernel

    # Path to the Krishna font to display the typed text
    module_path: boot():/boot/assets/krishna_font.kfont
    module_string: krishna-font

    # Path to the krishna image to display while booting.
    module_path: boot():/boot/assets/krishna_logo.rgba
    module_string: krishna-logo

    # Path to the mouse pointer image source
    module_path: boot():/boot/assets/krishna_cursor.rgba
    module_cmdline: krishna-cursor

    # Path to the desktop wallpaper
    module_path: boot():/boot/assets/krishna_wallpaper.rgba
    module_cmdline: krishna-wallpaper